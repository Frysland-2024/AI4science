[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxrd-forward-loss-pilot"
version = "0.1.0"
description = "Isolated paired pilot for supervised PXRD parameter regression with differentiable reconstruction loss."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "pymatgen", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../xrd_inversion/src", "../xrd_robustness/src"]
testpaths = ["tests"]
