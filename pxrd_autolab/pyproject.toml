[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxrd-autolab"
version = "0.1.0"
description = "Fail-closed PXRD experiment bookkeeping and report generation"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pxrd-autolab = "pxrd_autolab.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
