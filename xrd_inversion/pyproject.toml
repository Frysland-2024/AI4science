[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-inversion"
version = "0.1.0"
description = "Auditable PXRD quantitative-inversion pilots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pymatgen"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../xrd_robustness/src"]
