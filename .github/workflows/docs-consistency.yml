name: Docs Consistency

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/CURRENT_STATE.md"
      - "docs/README.md"
      - "docs/START_HERE_FOR_SUPERVISORS.md"
      - "docs/REVIEWER_GUIDE.md"
      - "scripts/check_docs_consistency.py"
      - "tests/test_docs_consistency.py"
      - "scripts/check_pr_hygiene.py"
      - "tests/test_pr_hygiene.py"
      - "docs/RESEARCH_WORKFLOW.md"
      - ".github/workflows/docs-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check guardrail unit tests
        run: python -m unittest discover -s tests -p "test_docs_consistency.py" -v
      - name: Test existing PR hygiene parser and safeguards
        run: python -m unittest discover -s tests -p "test_pr_hygiene.py" -v
      - name: Check authoritative current context and local links
        run: python scripts/check_docs_consistency.py --root .

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test anti-sprawl rules
        run: python -m unittest discover -s tests -p "test_pr_hygiene.py" -v
      - name: Inspect PR changes and justification
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_hygiene.py --base "$PR_BASE_SHA" --head HEAD

  # ONE-TIME MAINTENANCE (remove immediately after verified completion)
  retire-two-legacy-workflows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Remove exactly four verified archived legacy run records
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const targets = [
              { id: 39119567577, path: ".github/workflows/pxrd-autolab-p0.yml", name: "PXRD AutoLab P0" },
              { id: 39119583230, path: ".github/workflows/pxrd-autolab-p0.yml", name: "PXRD AutoLab P0" },
              { id: 39121396653, path: ".github/workflows/research-task-bridge.yml", name: "Research Task Bridge tests" },
              { id: 39121412176, path: ".github/workflows/research-task-bridge.yml", name: "Research Task Bridge tests" },
            ];
            for (const target of targets) {
              let run;
              try {
                run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: target.id })).data;
              } catch (err) {
                if (err.status === 404) {
                  core.info("Already deleted: " + target.id);
                  continue;
                }
                throw err;
              }
              if (run.name !== target.name || run.path !== target.path ||
                  run.status !== "completed" || run.conclusion !== "success") {
                core.setFailed("Refusing unsafe deletion of run " + target.id +
                  ": " + JSON.stringify({ name: run.name, path: run.path,
                                           status: run.status, conclusion: run.conclusion }));
                return;
              }
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: target.id });
              core.info("Deleted archived workflow run " + target.id + " (" + target.name + ")");
            }
