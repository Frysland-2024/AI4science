name: Docs Consistency

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/CURRENT_STATE.md"
      - "docs/README.md"
      - "docs/START_HERE_FOR_SUPERVISORS.md"
      - "docs/REVIEWER_GUIDE.md"
      - "scripts/check_docs_consistency.py"
      - "tests/test_docs_consistency.py"
      - "scripts/check_pr_hygiene.py"
      - "tests/test_pr_hygiene.py"
      - "docs/RESEARCH_WORKFLOW.md"
      - ".github/workflows/docs-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check guardrail unit tests
        run: python -m unittest discover -s tests -p "test_docs_consistency.py" -v
      - name: Test existing PR hygiene parser and safeguards
        run: python -m unittest discover -s tests -p "test_pr_hygiene.py" -v
      - name: Check authoritative current context and local links
        run: python scripts/check_docs_consistency.py --root .

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test anti-sprawl rules
        run: python -m unittest discover -s tests -p "test_pr_hygiene.py" -v
      - name: Inspect PR changes and justification
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_hygiene.py --base "$PR_BASE_SHA" --head HEAD

  # ONE TIME, run-identity-checked cleanup; delete this job after success.
  retire-obsolete-branch-cleanup-runs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the three archived branch-cleanup runs only
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ids = [42504247434, 42505778135, 42506249341];
            for (const run_id of ids) {
              let run;
              try {
                run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id })).data;
              } catch (err) {
                if (err.status === 404) {
                  core.info("Already deleted: " + run_id);
                  continue;
                }
                throw err;
              }
              const isArchivedTarget =
                run.name === "Remove merged PR branches" &&
                run.path === ".github/workflows/pr-merged-branch-cleanup.yml" &&
                run.status === "completed" &&
                ["success", "skipped"].includes(run.conclusion);
              if (!isArchivedTarget) {
                core.setFailed("Refusing to delete non-target run " + run_id);
                return;
              }
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
              core.info("Deleted archived branch cleanup run " + run_id);
            }
