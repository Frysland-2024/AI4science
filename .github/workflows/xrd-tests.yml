name: XRD tests

on:
  push:
    paths:
      - "xrd_robustness/**"
      - ".github/workflows/xrd-tests.yml"
  pull_request:
    paths:
      - "xrd_robustness/**"
      - ".github/workflows/xrd-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: xrd_robustness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xrd_robustness/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Import installed package
        run: python -c "import xrd_robustness; print(xrd_robustness.__file__)"
      - name: Run tests
        run: python -m pytest -q
