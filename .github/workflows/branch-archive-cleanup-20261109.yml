# Manual-only GitHub workflow. PREVIEW by default.
# Preserve each exact historical commit as a remote tag before deleting its branch.
name: Archive and clean historical branches
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PREVIEW or ARCHIVE_DELETE (tag each head before deleting the branch)"
        type: choice
        options: [PREVIEW, ARCHIVE_DELETE]
        required: true
        default: PREVIEW
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Frysland-2024/AI4science'
    runs-on: ubuntu-latest
    concurrency:
      group: one-time-branch-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preview or safely archive and prune
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE" != "PREVIEW" && "$MODE" != "ARCHIVE_DELETE" ]]; then
            echo "Invalid mode"; exit 1
          fi
          cat > "$RUNNER_TEMP/historical_branches.tsv" <<'BRANCH_SNAPSHOT'
          archive/consolidated-branch-history-20261109	417394132c8c7d27a82603b32829bf6684dd8619
          BRANCH_SNAPSHOT
          printf 'branch\toriginal_sha\tstatus\n' > "$RUNNER_TEMP/branch_cleanup_report.tsv"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          open_pr_heads="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref')"
          while IFS=$'\t' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|integrate/v11-server-pipeline-20261109|issue55-resnet-js-search|feat/v11-prefetch-train-validation-20261103|feat/v11-server-oneclick-optuna-20261103)
                printf '%s\t%s\tKEPT\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue;;
            esac
            if grep -Fxq -- "$branch" <<< "$open_pr_heads"; then
              printf '%s\t%s\tSKIP_OPEN_PR\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then
              printf '%s\t%s\tALREADY_GONE\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              printf '%s\t%s\tSKIP_HEAD_CHANGED\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            if [[ "$MODE" == "PREVIEW" ]]; then
              printf '%s\t%s\tWOULD_ARCHIVE_AND_DELETE\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            tag="branch-archive/2026-11-09/$branch"
            tag_sha="$(git ls-remote --tags --refs origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$tag_sha" && "$tag_sha" != "$expected" ]]; then
              printf '%s\t%s\tSKIP_TAG_COLLISION\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            if [[ -z "$tag_sha" ]]; then
              git tag "$tag" "$expected"
              if ! git push origin "refs/tags/$tag"; then
                printf '%s\t%s\tERROR_TAG_PUSH_FAILED\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
              fi
            fi
            verified_tag="$(git ls-remote --tags --refs origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ "$verified_tag" != "$expected" ]]; then
              printf '%s\t%s\tERROR_TAG_UNVERIFIED\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"; continue
            fi
            if git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"; then
              printf '%s\t%s\tARCHIVED_AND_DELETED\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"
            else
              printf '%s\t%s\tARCHIVED_BUT_DELETION_BLOCKED\n' "$branch" "$expected" >> "$RUNNER_TEMP/branch_cleanup_report.tsv"
            fi
          done < "$RUNNER_TEMP/historical_branches.tsv"
          cat "$RUNNER_TEMP/branch_cleanup_report.tsv"
          {
            echo "## Branch cleanup mode: $MODE"
            echo "The five protected branches are retained; each deleted historical head is available as a recovery tag."
            cat "$RUNNER_TEMP/branch_cleanup_report.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save branch ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-ledger
          path: ${{ runner.temp }}/branch_cleanup_report.tsv
          if-no-files-found: warn
