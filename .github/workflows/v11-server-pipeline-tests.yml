name: PXRD V11 server data pipeline checks

on:
  push:
    paths:
      - "server_migration/**"
      - ".github/workflows/v11-server-pipeline-tests.yml"
  pull_request:
    paths:
      - "server_migration/**"
      - ".github/workflows/v11-server-pipeline-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XRD package and CPU tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./xrd_robustness[test]"
      - name: Compile V11 one-click and multiprocessing source
        run: python -m compileall -q server_migration/one_click_v11.py server_migration/v11_prefetch.py server_migration/tests
      - name: Run parent integrity and deterministic prefetch tests
        run: python -m pytest -q server_migration/tests
