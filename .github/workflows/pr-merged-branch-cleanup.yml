name: Remove merged PR branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete only an unchanged, unused head branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const branch = pr.head.ref;
            const expectedSha = pr.head.sha;

            // Never touch the default branch, or branches from forks.
            if (!branch || branch === context.payload.repository.default_branch) {
              core.info("Skipping default/empty branch.");
              return;
            }
            if (pr.head.repo?.full_name !== context.payload.repository.full_name) {
              core.info("Skipping a fork branch.");
              return;
            }

            let current;
            try {
              const response = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`
              });
              current = response.data.object.sha;
            } catch (error) {
              if (error.status === 404) {
                core.info("Branch already removed; nothing to do.");
                return;
              }
              throw error;
            }

            // Do not delete a branch if work was added after the merge.
            if (current !== expectedSha) {
              core.info("Branch tip changed since merge; preserving it.");
              return;
            }

            // Do not disrupt stacked PRs or another open PR on the same branch.
            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            const inUse = openPRs.some(other =>
              other.base.ref === branch ||
              (other.head.repo?.full_name === context.payload.repository.full_name &&
               other.head.ref === branch)
            );
            if (inUse) {
              core.info("Branch is used by an open PR; preserving it.");
              return;
            }

            await github.rest.git.deleteRef({
              owner, repo, ref: `heads/${branch}`
            });
            core.info(`Deleted merged PR head branch: ${branch}`);
