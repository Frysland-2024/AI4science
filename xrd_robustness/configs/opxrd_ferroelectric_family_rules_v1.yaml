# opXRD Ferroelectric-Related Material Family Rules v1
# ============================================================
# Schema version: opxrd-family-rules-v1
# Created: 2026-08-04
# Purpose: Auditable rules for matching opXRD experimental spectra
#   to ferroelectric-related functional oxide/ceramic material families.
#
# Design constraints:
#   - Rules are external to Python code for auditability.
#   - Every match records: family_rule_id, matched_family, match_method,
#     match_confidence, manual_review_required.
#   - Element-only matching is insufficient; structural/contextual clues
#     are required for strict_ferroelectric classification.
#   - Exclusion rules prevent false-positive matches.

schema_version: "opxrd-family-rules-v1"
description: >
  Ferroelectric-related functional oxide/ceramic material family
  matching rules for opXRD experimental PXRD metadata screening.

# ----------------------------------------------------------
# Classification labels
# ----------------------------------------------------------
classification_labels:
  strict_ferroelectric: >
    Clear literature, database, or reliable materials-knowledge evidence
    supporting membership in a ferroelectric material system.
  ferroelectric_related: >
    Paraelectric phases, competing phases, precursor phases, phase-transition
    states, or closely related functional oxides of ferroelectric systems.
  uncertain: >
    Chemical-formula similarity only; cannot confirm target-domain membership.
  exclude: >
    Clearly not in the target material domain, or data quality/label fails.

# ----------------------------------------------------------
# Material families and matching rules
# ----------------------------------------------------------
families:

  - family_id: "BaTiO3_doped"
    family_name: "BaTiO3 and doped systems"
    category: strict_ferroelectric
    description: "Barium titanate and its doped/derivative compositions."
    rules:
      - rule_id: "BaTiO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BaTiO3"
          - "BaTi"
        require_elements: ["Ba", "Ti", "O"]
        exclude_elements: []
      - rule_id: "BaTiO3_doped_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Ba", "Ti", "O"]
        allow_extra_elements: ["Ca", "Sr", "Zr", "Sn", "Hf", "Mn", "Fe", "Nb", "La", "Ce", "Y"]
        max_extra_elements: 3
    exclusions:
      - "BaTiSi"   # Fresnoite, not perovskite
      - "BaTiGe"   # Germanate
      - "BaTiS"    # Sulfide

  - family_id: "SrTiO3_related"
    family_name: "SrTiO3 and Ba-Sr-Ti-O related phases"
    category: ferroelectric_related
    description: >
      Strontium titanate (quantum paraelectric) and related
      Ba-Sr-Ti-O solid solutions. SrTiO3 itself is not ferroelectric
      at room temperature but is a closely related functional oxide.
    rules:
      - rule_id: "SrTiO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "SrTiO3"
          - "SrTi"
        require_elements: ["Sr", "Ti", "O"]
      - rule_id: "BaSrTiO_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BaSrTiO"
          - "Ba_xSr"
          - "Ba1-xSrxTiO3"
          - "BST"
        require_elements: ["Ba", "Sr", "Ti", "O"]
      - rule_id: "SrTiO3_doped_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Sr", "Ti", "O"]
        allow_extra_elements: ["Ba", "Ca", "La", "Nb", "Fe", "Mn"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "PZT"
    family_name: "Pb-Zr-Ti-O (PZT)"
    category: strict_ferroelectric
    description: "Lead zirconate titanate and related Pb-Zr-Ti-O compositions."
    rules:
      - rule_id: "PZT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbZr"
          - "PbTi"
          - "PZT"
          - "Pb(Zr"
          - "Pb1-x"
        require_elements: ["Pb", "Zr", "Ti", "O"]
        require_any: ["PbZr", "Pb(Zr", "PZT"]
      - rule_id: "PbTiO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbTiO3"
        require_elements: ["Pb", "Ti", "O"]
      - rule_id: "PZT_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Pb", "O"]
        require_any_elements: ["Zr", "Ti"]
        allow_extra_elements: ["La", "Nb", "Mn", "Sb", "Sn", "Ba", "Sr", "Ca", "Fe", "Mg", "Zn", "Ni"]
        max_extra_elements: 4
    exclusions:
      - "PbTiO"      # Lead titanate oxide (PbTi2O5 etc, not perovskite PTO)
      - "PbTe"       # Telluride

  - family_id: "PLZT"
    family_name: "PLZT (Pb-La-Zr-Ti-O)"
    category: strict_ferroelectric
    description: "Lanthanum-doped lead zirconate titanate."
    rules:
      - rule_id: "PLZT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PLZT"
          - "PbLaZr"
          - "PbLaTi"
        require_elements: ["Pb", "La", "Zr", "Ti", "O"]
      - rule_id: "PLZT_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Pb", "La", "O"]
        require_any_elements: ["Zr", "Ti"]
        allow_extra_elements: ["Nb", "Mn", "Sb", "Sn"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "PbTiO3_pure"
    family_name: "PbTiO3 (pure lead titanate)"
    category: strict_ferroelectric
    description: "Pure lead titanate, a model ferroelectric perovskite."
    rules:
      - rule_id: "PbTiO3_exact"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbTiO3"
        require_elements: ["Pb", "Ti", "O"]
    exclusions: []

  - family_id: "KNbO3"
    family_name: "KNbO3 (potassium niobate)"
    category: strict_ferroelectric
    description: "Potassium niobate, a lead-free ferroelectric perovskite."
    rules:
      - rule_id: "KNbO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "KNbO3"
          - "KNb"
        require_elements: ["K", "Nb", "O"]
      - rule_id: "KNbO3_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["K", "Nb", "O"]
        allow_extra_elements: ["Na", "Li", "Ta", "Mn", "Fe"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "KNN"
    family_name: "K-Na-Nb-O (KNN)"
    category: strict_ferroelectric
    description: "Potassium sodium niobate, a leading lead-free piezoelectric."
    rules:
      - rule_id: "KNN_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "KNaNb"
          - "KNN"
          - "K_xNa"
          - "K0."
          - "(K,Na)NbO3"
          - "(K,Na)Nb"
          - "NaKNb"
        require_elements: ["K", "Na", "Nb", "O"]
      - rule_id: "KNN_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["K", "Na", "Nb", "O"]
        allow_extra_elements: ["Li", "Ta", "Sb", "Mn", "Fe", "Cu", "Ba", "Ca", "Sr", "Zr", "Bi", "La"]
        max_extra_elements: 5
    exclusions: []

  - family_id: "NaNbO3"
    family_name: "NaNbO3 (sodium niobate)"
    category: ferroelectric_related
    description: >
      Sodium niobate; antiferroelectric at room temperature but
      closely related to ferroelectric niobate systems.
    rules:
      - rule_id: "NaNbO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "NaNbO3"
          - "NaNb"
        require_elements: ["Na", "Nb", "O"]
      - rule_id: "NaNbO3_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Na", "Nb", "O"]
        allow_extra_elements: ["K", "Li", "Ta", "Bi", "Ba", "Ca", "Sr", "La"]
        max_extra_elements: 4
    exclusions: []

  - family_id: "BNT"
    family_name: "Bi-Na-Ti-O (BNT)"
    category: strict_ferroelectric
    description: "Bismuth sodium titanate, lead-free ferroelectric/relaxor."
    rules:
      - rule_id: "BNT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BiNaTiO"
          - "BNT"
          - "Bi0.5Na0.5TiO3"
          - "Bi_"
          - "NBT"
        require_elements: ["Bi", "Na", "Ti", "O"]
      - rule_id: "BNT_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Bi", "Na", "Ti", "O"]
        allow_extra_elements: ["K", "Ba", "Sr", "Ca", "La", "Mn", "Fe", "Nb", "Ta", "Zr", "Li"]
        max_extra_elements: 4
    exclusions: []

  - family_id: "BKT"
    family_name: "Bi-K-Ti-O (BKT)"
    category: strict_ferroelectric
    description: "Bismuth potassium titanate, ferroelectric perovskite."
    rules:
      - rule_id: "BKT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BiKTiO"
          - "BKT"
          - "Bi0.5K0.5TiO3"
        require_elements: ["Bi", "K", "Ti", "O"]
      - rule_id: "BKT_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Bi", "K", "Ti", "O"]
        allow_extra_elements: ["Na", "Ba", "Sr", "Ca", "La", "Mn", "Nb", "Ta", "Zr"]
        max_extra_elements: 4
    exclusions: []

  - family_id: "BNT_BT"
    family_name: "BNT-BT solid solutions"
    category: strict_ferroelectric
    description: "Bi-Na-Ti-O / BaTiO3 solid solutions (e.g., BNT-BT, BNKT-BT)."
    rules:
      - rule_id: "BNT_BT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BNT-BT"
          - "BNKT-BT"
          - "BNT-xBT"
        require_elements: ["Bi", "Na", "Ba", "Ti", "O"]
      - rule_id: "BNT_BT_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Bi", "Ba", "Ti", "O"]
        allow_extra_elements: ["Na", "K", "Sr", "Ca", "Zr", "Nb"]
        max_extra_elements: 4
    exclusions: []

  - family_id: "BiFeO3"
    family_name: "BiFeO3 (bismuth ferrite)"
    category: strict_ferroelectric
    description: "Bismuth ferrite, multiferroic with ferroelectric ordering."
    rules:
      - rule_id: "BiFeO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BiFeO3"
          - "BiFe"
        require_elements: ["Bi", "Fe", "O"]
      - rule_id: "BiFeO3_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Bi", "Fe", "O"]
        allow_extra_elements: ["La", "Nd", "Sm", "Gd", "Ba", "Ca", "Sr", "Mn", "Co", "Ti", "Nb", "Sc", "Cr", "Ni", "Cu", "Zn"]
        max_extra_elements: 5
    exclusions:
      - "BiFeS"     # Sulfide
      - "BiFeSe"    # Selenide

  - family_id: "LiNbO3"
    family_name: "LiNbO3 (lithium niobate)"
    category: strict_ferroelectric
    description: "Lithium niobate, ferroelectric with high Curie temperature."
    rules:
      - rule_id: "LiNbO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "LiNbO3"
          - "LiNb"
        require_elements: ["Li", "Nb", "O"]
      - rule_id: "LiNbO3_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Li", "Nb", "O"]
        allow_extra_elements: ["Mg", "Zn", "Fe", "Mn", "Er", "Yb", "Tm", "Nd", "Ta"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "LiTaO3"
    family_name: "LiTaO3 (lithium tantalate)"
    category: strict_ferroelectric
    description: "Lithium tantalate, ferroelectric."
    rules:
      - rule_id: "LiTaO3_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "LiTaO3"
          - "LiTa"
        require_elements: ["Li", "Ta", "O"]
      - rule_id: "LiTaO3_doped"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Li", "Ta", "O"]
        allow_extra_elements: ["Nb", "Mg", "Fe", "Nd"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "HfO2_ZrO2_FE"
    family_name: "HfO2-ZrO2 ferroelectric systems"
    category: strict_ferroelectric
    description: >
      HfO2-based and ZrO2-based ferroelectric thin films.
      Ferroelectricity in doped HfO2 arises from the polar
      orthorhombic Pca2_1 phase.
    rules:
      - rule_id: "HfZrO_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "HfZrO"
          - "Hf0."
          - "HZO"
        require_elements: ["Hf", "Zr", "O"]
      - rule_id: "HfO2_doped_FE"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Hf", "O"]
        allow_extra_elements: ["Zr", "Si", "Al", "Y", "Gd", "La", "Sr", "N"]
        max_extra_elements: 3
    exclusions: []

  - family_id: "Aurivillius"
    family_name: "Aurivillius layered perovskites"
    category: strict_ferroelectric
    description: >
      Aurivillius phases: (Bi2O2)(A_{n-1}B_nO_{3n+1}) layered
      ferroelectric perovskites.
    rules:
      - rule_id: "Aurivillius_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Bi", "O"]
        require_any_elements: ["Ti", "Nb", "Ta", "W", "Mo", "Fe"]
        allow_extra_elements: ["Sr", "Ba", "Ca", "Pb", "La", "Nd", "Sm", "Pr", "Na", "K", "Mn", "Cr"]
        max_extra_elements: 6
      - rule_id: "Aurivillius_name"
        method: name_match
        confidence: medium
        manual_review: true
        patterns:
          - "Aurivillius"
          - "Bi2WO6"
          - "Bi3TiNbO9"
          - "Bi4Ti3O12"
          - "SrBi2Ta2O9"
          - "SBT"
          - "SrBi2Nb2O9"
          - "SBN"
          - "Bi2MoO6"
          - "CaBi2Nb2O9"
    exclusions: []

  - family_id: "TungstenBronze"
    family_name: "Tungsten-bronze type ferroelectrics"
    category: strict_ferroelectric
    description: >
      Tetragonal tungsten bronze (TTB) type ferroelectric oxides
      with general formula (A1)4(A2)2(C)4(B1)2(B2)8O30.
    rules:
      - rule_id: "TTB_elements"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["O"]
        require_any_elements: ["Nb", "Ta", "W"]
        allow_extra_elements: ["Ba", "Sr", "Ca", "Pb", "Na", "K", "La", "Nd", "Sm", "Gd", "Bi", "Ti", "Fe", "Mn"]
        max_extra_elements: 7
      - rule_id: "TTB_known"
        method: name_match
        confidence: medium
        manual_review: true
        patterns:
          - "SBN"        # Sr_xBa_{1-x}Nb2O6
          - "SrBaNb"
          - "BaNaNb"
          - "Ba2NaNb5O15"
          - "KLiNb"
          - "PbNb2O6"
          - "PNN"
          - "SrxBa1-xNb2O6"
          - "BNN"
    exclusions: []

  - family_id: "Relaxor_FE"
    family_name: "Relaxor ferroelectrics (common systems)"
    category: strict_ferroelectric
    description: "Classical relaxor ferroelectric systems."
    rules:
      - rule_id: "PMN_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbMg"
          - "PMN"
          - "Pb(Mg"
        require_elements: ["Pb", "Mg", "Nb", "O"]
      - rule_id: "PZN_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbZn"
          - "PZN"
          - "Pb(Zn"
        require_elements: ["Pb", "Zn", "Nb", "O"]
      - rule_id: "PIN_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbIn"
          - "PIN"
          - "Pb(In"
        require_elements: ["Pb", "In", "Nb", "O"]
      - rule_id: "PSN_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PbSc"
          - "PSN"
          - "Pb(Sc"
        require_elements: ["Pb", "Sc", "Nb", "O"]
      - rule_id: "PMN_PT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "PMN-PT"
          - "PMN-xPT"
        require_elements: ["Pb", "Mg", "Nb", "Ti", "O"]
    exclusions: []

  - family_id: "LeadFreePiezo"
    family_name: "Lead-free piezoelectric/ferroelectric systems"
    category: strict_ferroelectric
    description: "Other lead-free piezoelectric compositions not covered above."
    rules:
      - rule_id: "BT_BCT_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BCT-BZT"
          - "BZT-BCT"
          - "BaCaTiO"
          - "BaZrTiO"
          - "BCZT"
          - "Ba(Zr"
          - "Ba(Ti"
        require_elements: ["Ba", "Ca", "Zr", "Ti", "O"]
      - rule_id: "BaTiO3_Ca_Zr"
        method: element_set_match
        confidence: medium
        manual_review: true
        require_elements: ["Ba", "Ca", "Zr", "Ti", "O"]
        max_extra_elements: 3
      - rule_id: "BNKTZ_formula"
        method: formula_match
        confidence: high
        manual_review: false
        patterns:
          - "BNKT"
          - "BiNaKTiO"
        require_elements: ["Bi", "Na", "K", "Ti", "O"]
    exclusions: []

# ----------------------------------------------------------
# Global exclusion rules
# ----------------------------------------------------------
global_exclusions:
  # Non-oxide materials
  - rule_id: "exclude_non_oxide"
    description: "Exclude materials without oxygen (not oxides/ceramics)"
    condition: "oxygen_not_in_elements"
    reason: "Ferroelectric ceramics domain requires oxide materials"

  # Clearly non-ceramic
  - rule_id: "exclude_polymer_organic"
    description: "Exclude organic/polymer materials"
    condition: "elements_all_in ['C','H','N','O','S','Cl','Br','I','F']"
    reason: "Not inorganic ceramic"

  # Pure metals/alloys
  - rule_id: "exclude_metals"
    description: "Exclude pure metals and alloys without oxygen"
    condition: "no_oxygen_and_no_anion"
    reason: "Not ceramic/oxide material"

  # Minerals that are clearly not ferroelectric ceramics
  - rule_id: "exclude_common_nonFE_minerals"
    description: "Exclude common non-ferroelectric minerals"
    patterns:
      - "Quartz"
      - "Calcite"
      - "Dolomite"
      - "Feldspar"
      - "Mica"
      - "Kaolinite"
      - "Montmorillonite"
      - "Zeolite"
      - "Halite"
      - "Gypsum"
      - "Anhydrite"
      - "Pyrite"
      - "Hematite"
      - "Magnetite"
      - "Corundum"
      - "Rutile"
      - "Anatase"
      - "Brookite"
      - "Ilmenite"
      - "Spinel"     # MgAl2O4-type, unless specifically ferroelectric composition
      - "Perovskite" # CaTiO3 natural mineral, not ferroelectric
    reason: "Common non-ferroelectric mineral or ceramic"

# ----------------------------------------------------------
# Element-to-family index for fast lookup
# ----------------------------------------------------------
element_family_index:
  Ba: ["BaTiO3_doped", "SrTiO3_related", "BNT_BT", "Aurivillius", "TungstenBronze", "LeadFreePiezo"]
  Ti: ["BaTiO3_doped", "SrTiO3_related", "PZT", "PLZT", "PbTiO3_pure", "BNT", "BKT", "BNT_BT", "Aurivillius", "TungstenBronze", "LeadFreePiezo", "BiFeO3"]
  Pb: ["PZT", "PLZT", "PbTiO3_pure", "Relaxor_FE", "Aurivillius", "TungstenBronze"]
  Zr: ["PZT", "PLZT", "HfO2_ZrO2_FE", "LeadFreePiezo"]
  Nb: ["KNbO3", "KNN", "NaNbO3", "TungstenBronze", "Relaxor_FE", "Aurivillius", "LiNbO3"]
  Bi: ["BNT", "BKT", "BNT_BT", "BiFeO3", "Aurivillius"]
  K:  ["KNbO3", "KNN", "BKT", "TungstenBronze", "LeadFreePiezo"]
  Na: ["KNN", "NaNbO3", "BNT", "BNT_BT", "TungstenBronze", "LeadFreePiezo"]
  Li: ["LiNbO3", "LiTaO3", "KNN", "TungstenBronze"]
  Ta: ["LiTaO3", "Aurivillius", "TungstenBronze", "KNN"]
  Hf: ["HfO2_ZrO2_FE", "BaTiO3_doped"]
  Fe: ["BiFeO3", "Aurivillius", "TungstenBronze"]
  Mg: ["Relaxor_FE", "LiNbO3"]
  Zn: ["Relaxor_FE"]
  In: ["Relaxor_FE"]
  Sc: ["Relaxor_FE"]
  W:  ["Aurivillius", "TungstenBronze"]
  Ca: ["LeadFreePiezo", "BaTiO3_doped", "Aurivillius", "TungstenBronze"]
