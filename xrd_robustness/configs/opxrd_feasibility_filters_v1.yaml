                  "Pm-3", "Pn-3", "Fm-3", "Fd-3", "Im-3", "Pa-3", "Ia-3",
                  "P-43m", "F-43m", "I-43m", "P-43n", "F-43c", "I-43d",
                  "Pm-3m", "Pn-3n", "Pm-3n", "Pn-3m",
                  "Fm-3m", "Fm-3c", "Fd-3m", "Fd-3c",
                  "Im-3m", "Ia-3d"]

# ----------------------------------------------------------
# Experimental spectrum quality filters
# ----------------------------------------------------------
quality_filters:
  minimum_data_points: 50
  minimum_2theta_range: 5.0    # degrees
  minimum_max_2theta: 20.0     # degrees
  maximum_min_2theta: 15.0     # degrees
  require_monotonic_axis: true
  require_nonzero_intensity: true
  require_finite_intensity: true
  max_zero_fraction: 0.95      # max fraction of zero intensity points

  # Overlap with model input range [5, 60] degrees
  model_2theta_min: 5.0
  model_2theta_max: 60.0
  require_overlap: true
  min_overlap_fraction: 0.3    # at least 30% of data points inside model range

# ----------------------------------------------------------
# Label reliability tiers
# ----------------------------------------------------------
label_tiers:
  tier_1_reliable:
    description: "Space group number from CIF or reliable source, no conflict"
    requires:
      - space_group_number is not null
      - label_source in ["cif", "database"]
      - no label_conflict
  tier_2_probable:
    description: "Space group symbol that can be mapped, or single source"
    requires:
      - space_group_symbol is not null
      - label_confidence >= "medium"
  tier_3_uncertain:
    description: "Label exists but cannot be reliably verified"
    requires:
      - any_structure_label_exists
  tier_4_unlabeled:
    description: "No structure label available"
    requires:
      - no_structure_label

# ----------------------------------------------------------
# Exclusion reasons (for reporting)
# ----------------------------------------------------------
exclusion_reasons:
  - reason_id: "simulated_pattern"
    description: "Simulated/computed pattern, not experimental PXRD"
    priority: 1
  - reason_id: "no_two_theta"
    description: "Missing two_theta_values"
    priority: 2
  - reason_id: "no_intensity"
    description: "Missing or all-zero intensity values"
    priority: 3
  - reason_id: "insufficient_points"
    description: "Too few data points"
    priority: 4
  - reason_id: "narrow_2theta_range"
    description: "2theta range too narrow"
    priority: 5
  - reason_id: "non_monotonic_axis"
    description: "2theta axis is not monotonic"
    priority: 6
  - reason_id: "too_many_zeros"
    description: "Too high fraction of zero intensity points"
    priority: 7
  - reason_id: "no_overlap_with_model_range"
    description: "Insufficient overlap with model input [5,60] degrees"
    priority: 8
  - reason_id: "no_space_group_label"
    description: "No space group number or symbol available"
    priority: 9
  - reason_id: "label_conflict"
    description: "Conflicting structure labels cannot be resolved"
    priority: 10
  - reason_id: "multiphase_uncertain"
    description: "Multiple phases without clear target phase label"
    priority: 11
  - reason_id: "not_target_domain"
    description: "Does not match any ferroelectric-related family"
    priority: 12
  - reason_id: "global_exclusion_rule"
    description: "Excluded by global exclusion rules"
    priority: 13
  - reason_id: "parse_error"
    description: "JSON parse or structure extraction error"
    priority: 14
  - reason_id: "missing_metadata"
    description: "Essential metadata fields missing"
    priority: 15

# ----------------------------------------------------------
# Grouping configuration
# ----------------------------------------------------------
grouping:
  # Similarity threshold for duplicate detection via spectrum correlation
  correlation_threshold: 0.99
  # Hash types to compute
  hash_types:
    - "file_sha256"
    - "normalized_spectrum_sha256"
  # Time-series detection
  time_series:
    max_time_gap_seconds: 86400   # 24 hours
    min_series_length: 3          # minimum consecutive scans for series
  # Composition grouping
  composition:
    normalize: true                # normalize formula strings
    tolerance: 0.01                # stoichiometry tolerance for float comparison

# ----------------------------------------------------------
# Split proposal parameters
# ----------------------------------------------------------
split_proposal:
  seven_class:
    support_per_class: 5
    adaptation_validation_per_class_min: 5
    adaptation_validation_per_class_target: 10
    external_test_per_class_min: 15
    external_test_per_class_target: 20
  five_class:
    support_per_class: 5
    adaptation_validation_per_class_min: 5
    external_test_per_class_min: 15
  seed: 20260804
  min_families_per_class: 3
  max_samples_per_group_in_split: 1   # No cross-split sample groups
