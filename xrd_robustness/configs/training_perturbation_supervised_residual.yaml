# Historical V7 Pilot / future research branch; not a V8 mainline configuration.
mode: perturbation_supervised_residual
pilot_scope: peak_shift_and_effective_peak_width_only
lambda_perturb: 1.0
lambda_res: 0.1
candidate_lambda_perturb: [0.1, 1.0, 3.0]
candidate_lambda_res: [0.01, 0.1, 1.0]
residual_head_depth: 1
perturbation_head_depth: 1
zero_shift_target_scale_deg: 0.2
log_fwhm_target_scale: 1.0
warmup_epochs: 5
ramp_epochs: 5
optimizer: adamw
epochs: 50
learning_rate: 0.0001
weight_decay: 0.0001
