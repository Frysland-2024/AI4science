[project]
name = "xrd-robustness"
version = "0.1.0"
description = "Physics-grounded robustness experiments for 1D powder XRD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
science = ["mp-api", "pymatgen", "torch"]
test = ["pytest"]

[tool.unittest]
start-directory = "tests"
