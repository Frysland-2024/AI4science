[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-robustness"
version = "0.1.0"
description = "Physics-grounded robustness experiments for 1D powder XRD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.scripts]
xrd-train = "xrd_robustness.training.runner:main"

[project.optional-dependencies]
science = ["mp-api", "pymatgen", "scipy>=1.10", "PyYAML>=6"]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8", "scipy>=1.10", "PyYAML>=6", "pymatgen", "mp-api", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data_bound: requires the ignored local formal_14060 dataset and manifests",
]

[tool.unittest]
start-directory = "tests"
