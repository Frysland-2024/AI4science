[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxrd-router-mvp"
version = "0.1.0"
description = "Candidate-limited fixed-CIF PXRD ranking and lattice fitting prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
ui = ["matplotlib>=3.7", "streamlit>=1.30"]

[tool.setuptools.packages.find]
include = ["pxrd_router_mvp*"]
